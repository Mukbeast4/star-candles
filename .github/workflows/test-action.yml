name: test-action

on:
  push:
    branches:
      - feature/reusable-action
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-action

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          chart-branch: chart-test
